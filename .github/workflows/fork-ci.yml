name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Match shared CI's per-PR supersession without dropping pending main pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-update:
    name: Windows self-update entry point
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run Windows updater regression
        shell: bash
        run: bin/fm-test-run.sh tests/fm-update-windows.test.sh

  reconciliation-windows:
    name: Windows reconciliation (${{ matrix.subject }})
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: core
            script: ""
            case: ""
          - subject: copilot-launch
            script: tests/fm-spawn-dispatch-profile.test.sh
            case: test_copilot_threads_model_effort_and_hooks
          - subject: legacy-rollback
            script: tests/fm-teardown.test.sh
            case: test_legacy_record_rolls_the_stamp_back_when_the_marker_write_fails
          - subject: pr-completion
            script: tests/fm-pr-check-security.test.sh
            case: test_azure_poll_notification_and_replay
            timeout: 15
            script-timeout: 600
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install tasks-axi for backlog fixtures
        if: matrix.subject == 'legacy-rollback' || matrix.subject == 'pr-completion'
        shell: bash
        run: |
          set -eu
          npm install -g tasks-axi@0.2.5
          tasks-axi --version
      - name: Run focused native Windows contracts
        if: matrix.subject == 'core'
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          node --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
            tests/fm-reconcile-validation.test.sh \
            tests/fm-backend-herdr-treehouse.test.sh \
            tests/fm-pi-windows-shell-invocation.test.sh \
            tests/fm-platform-process.test.sh \
            tests/fm-private-path.test.sh \
            tests/fm-startup-performance.test.sh
          FM_TEST_ONLY=test_bootstrap_batches_already_in_flight_rows \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-bootstrap.test.sh
          FM_TEST_ONLY=test_bootstrap_diagnostics_stream_before_probe_completion \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-session-start.test.sh
          FM_TEST_ONLY=test_windows_pr_publication_removes_broad_inheritance \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-pr-check-security.test.sh
          for test_case in \
            test_clone_root_identity_forms \
            test_directory_aliases_preserve_local_only \
            test_pruning_preserves_unlanded_gone_branches; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
                tests/fm-fleet-sync.test.sh
          done
      - name: Run named Windows reconciliation case
        if: matrix.subject != 'core'
        shell: bash
        env:
          FM_LIVE: "0"
          FM_TEST_ONLY: ${{ matrix.case }}
          FM_TEST_SCRIPT: ${{ matrix.script }}
          FM_TEST_SCRIPT_TIMEOUT: ${{ matrix.script-timeout || 300 }}
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required for the selected fixture"; exit 1; }
          git --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs "$FM_TEST_SCRIPT_TIMEOUT" "$FM_TEST_SCRIPT"
      - name: Run native Azure downstream contracts
        if: matrix.subject == 'pr-completion'
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          FM_TEST_ONLY=test_azure_completed_pr_preserves_backlog_link \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-teardown.test.sh
          FM_TEST_ONLY=test_azure_pr_uses_live_source_head \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-review-diff.test.sh

  harness-package-compatibility:
    name: Harness package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned harness packages
        run: |
          set -eu
          npm install -g \
            @earendil-works/pi-coding-agent@0.84.3 \
            opencode-ai@1.18.23 \
            typescript@5.9.3
          pi --version
          opencode --version
          tsc --version
      - name: Run non-credentialed Pi compatibility checks
        run: |
          set -eu
          bin/fm-test-run.sh tests/fm-pi-primary-types.test.sh tests/fm-platform-process.test.sh
          bin/fm-test-run.sh tests/fm-pi-branch-extension.test.sh
