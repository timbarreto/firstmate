name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-update:
    name: Windows self-update entry point
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run Windows updater regression
        shell: bash
        run: bin/fm-test-run.sh tests/fm-update-windows.test.sh

  reconciliation-windows:
    name: Windows reconciliation (${{ matrix.subject }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: core
            script: ""
            case: ""
          - subject: copilot-launch
            script: tests/fm-spawn-dispatch-profile.test.sh
            case: test_copilot_threads_model_effort_and_hooks
          - subject: legacy-rollback
            script: tests/fm-teardown.test.sh
            case: test_legacy_record_rolls_the_stamp_back_when_the_marker_write_fails
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install tasks-axi for the rollback fixture
        if: matrix.subject == 'legacy-rollback'
        shell: bash
        run: |
          set -eu
          npm install -g tasks-axi@0.2.5
          tasks-axi --version
      - name: Run focused native Windows contracts
        if: matrix.subject == 'core'
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          node --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
            tests/fm-reconcile-validation.test.sh \
            tests/fm-backend-herdr-treehouse.test.sh \
            tests/fm-pi-windows-shell-invocation.test.sh
      - name: Run named Windows reconciliation case
        if: matrix.subject != 'core'
        shell: bash
        env:
          FM_LIVE: "0"
          FM_TEST_ONLY: ${{ matrix.case }}
          FM_TEST_SCRIPT: ${{ matrix.script }}
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required for the selected fixture"; exit 1; }
          git --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 300 "$FM_TEST_SCRIPT"

  harness-package-compatibility:
    name: Harness package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned harness packages
        run: |
          set -eu
          npm install -g \
            @earendil-works/pi-coding-agent@0.84.3 \
            opencode-ai@1.18.23 \
            typescript@5.9.3
          pi --version
          opencode --version
          tsc --version
      - name: Run non-credentialed Pi compatibility checks
        run: |
          set -eu
          bin/fm-test-run.sh tests/fm-pi-primary-types.test.sh
          bin/fm-test-run.sh tests/fm-pi-branch-extension.test.sh
