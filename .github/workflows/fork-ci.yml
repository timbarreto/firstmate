name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Match shared CI's per-PR supersession without dropping pending main pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-update:
    name: Windows self-update entry point
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run Windows updater regression
        shell: bash
        run: bin/fm-test-run.sh tests/fm-update-windows.test.sh

  reconciliation-windows:
    name: Windows reconciliation (${{ matrix.subject }})
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: core
            script: ""
            case: ""
          - subject: copilot-launch
            script: tests/fm-spawn-dispatch-profile.test.sh
            case: test_copilot_threads_model_effort_and_hooks
          - subject: legacy-rollback
            script: tests/fm-teardown.test.sh
            case: test_legacy_record_rolls_the_stamp_back_when_the_marker_write_fails
          - subject: pr-completion
            script: tests/fm-pr-check-security.test.sh
            case: test_azure_poll_notification_and_replay
            timeout: 15
            script-timeout: 600
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install tasks-axi for backlog fixtures
        if: matrix.subject == 'legacy-rollback' || matrix.subject == 'pr-completion'
        shell: bash
        run: |
          set -eu
          npm install -g tasks-axi@0.2.5
          tasks-axi --version
      - name: Run focused native Windows contracts
        if: matrix.subject == 'core'
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          node --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
            tests/fm-reconcile-validation.test.sh \
            tests/fm-backend-herdr-treehouse.test.sh \
            tests/fm-pi-windows-shell-invocation.test.sh \
            tests/fm-platform-process.test.sh \
            tests/fm-path.test.sh \
            tests/fm-private-path.test.sh \
            tests/fm-startup-performance.test.sh
          for test_case in \
            test_current_gen_path_stays_in_process \
            test_writer_process_budget \
            test_generation_first_line_characterization \
            test_prior_record_first_line_characterization \
            test_prior_record_nul_diagnostic_is_preserved \
            test_busy_paths_and_current_gen_preserve_caller_state \
            test_generation_read_error_returns_without_aborting \
            test_prior_record_read_failure_resets_sequence \
            test_current_gen_binding_stays_before_lock_for_apply \
            test_record_publication_keeps_lock_and_private_umask; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
                tests/fm-busy-state.test.sh
          done
          FM_TEST_ONLY=test_bootstrap_batches_already_in_flight_rows \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-bootstrap.test.sh
          FM_TEST_ONLY=test_bootstrap_diagnostics_stream_before_probe_completion \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-session-start.test.sh
          FM_TEST_ONLY=test_windows_pr_publication_removes_broad_inheritance \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-pr-check-security.test.sh
          for test_case in \
            test_clone_root_identity_forms \
            test_directory_aliases_preserve_local_only \
            test_pruning_preserves_unlanded_gone_branches; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
                tests/fm-fleet-sync.test.sh
          done
      - name: Run named Windows reconciliation case
        if: matrix.subject != 'core'
        shell: bash
        env:
          FM_LIVE: "0"
          FM_TEST_ONLY: ${{ matrix.case }}
          FM_TEST_SCRIPT: ${{ matrix.script }}
          FM_TEST_SCRIPT_TIMEOUT: ${{ matrix.script-timeout || 300 }}
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required for the selected fixture"; exit 1; }
          git --version
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs "$FM_TEST_SCRIPT_TIMEOUT" "$FM_TEST_SCRIPT"
      - name: Run native Azure downstream contracts
        if: matrix.subject == 'pr-completion'
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          FM_TEST_ONLY=test_windows_pr_registration_path_spellings \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 300 \
              tests/fm-pr-check-security.test.sh
          FM_TEST_ONLY=test_device_rerecord_preserves_private_policy \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-pr-check-security.test.sh
          FM_TEST_ONLY=test_azure_completed_pr_preserves_backlog_link \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-teardown.test.sh
          FM_TEST_ONLY=test_azure_pr_uses_live_source_head \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-review-diff.test.sh

  windows-management:
    name: Windows Copilot management
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run native management contracts without a live fleet
        shell: bash
        env:
          FM_LIVE: "0"
        run: |
          set -eu
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
            tests/fm-home-summary-request.test.sh \
            tests/fm-lock-fast.test.sh \
            tests/fm-pr-local-cost.test.sh \
            tests/fm-herdr-unregistered-agent.test.sh
          for test_case in \
            test_windows_powershell_pretool_transport \
            test_windows_worker_hook_semantic_lifecycle \
            test_windows_command_hooks_do_not_load_git_bash \
            test_windows_git_resolver_stops_after_preferred_installation \
            test_stop_repair_uses_its_known_harness \
            test_stop_uses_one_late_authorized_counter_transaction; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
                tests/fm-copilot-harness.test.sh
          done
          for test_case in \
            test_recovery_approved_and_idempotent \
            test_relaunch_slow_probe_consumes_deadline \
            test_relaunch_stuck_probe_is_bounded_and_reaped \
            test_relaunch_completed_probe_keeps_parent_transaction \
            test_windows_relaunch_query_deadline_reaps_native_process \
            test_control_inspect_accepts_windows_path_context \
            test_recovery_receipt_home_aliases_remain_readable; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 300 \
                tests/fm-control-recovery.test.sh
          done
          FM_TEST_ONLY=test_control_inspect_is_read_only_during_another_action \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 180 \
              tests/fm-control-relaunch.test.sh
          for test_case in \
            test_windows_relaunch_path_context_preserves_work \
            test_windows_relaunch_posix_paths_preserve_work \
            test_windows_relaunch_mixed_paths_preserve_work; do
            FM_TEST_ONLY="$test_case" \
              bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 300 \
                tests/fm-control-relaunch.test.sh
          done
          FM_TEST_ONLY=test_windows_home_spellings_enqueue_once \
            bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 300 \
              tests/fm-send-inbox.test.sh

  harness-package-compatibility:
    name: Harness package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned harness packages
        run: |
          set -eu
          npm install -g \
            @earendil-works/pi-coding-agent@0.84.3 \
            opencode-ai@1.18.23 \
            typescript@5.9.3
          pi --version
          opencode --version
          tsc --version
      - name: Run non-credentialed Pi compatibility checks
        run: |
          set -eu
          bin/fm-test-run.sh tests/fm-pi-primary-types.test.sh tests/fm-platform-process.test.sh
          bin/fm-test-run.sh tests/fm-pi-branch-extension.test.sh
